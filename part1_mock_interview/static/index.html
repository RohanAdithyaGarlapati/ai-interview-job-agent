<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Mock Interview</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.7.4/dist/livekit-client.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --line:#262b36;
    --text:#e8eaf0; --muted:#9aa3b2; --accent:#6366f1; --ok:#22c55e; --err:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:860px}
  h1{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
  .sub{color:var(--muted);margin:0 0 24px;font-size:14px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}

  .stage{display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 0}
  .orb{width:104px;height:104px;border-radius:50%;background:#20242e;
       border:1px solid var(--line);display:grid;place-items:center;font-size:38px;
       transition:transform .25s, box-shadow .25s}
  .orb.speaking{box-shadow:0 0 0 8px rgba(99,102,241,.18);transform:scale(1.05)}
  .who{font-size:13px;color:var(--muted)}

  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 26px;
         cursor:pointer;transition:opacity .15s}
  button:disabled{opacity:.45;cursor:not-allowed}
  .primary{background:var(--accent);color:#fff}
  .ghost{background:#242833;color:var(--text);border:1px solid var(--line)}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

  .status{margin-top:20px;padding:11px 14px;border-radius:9px;font-size:13px;
          background:#20242e;color:var(--muted);text-align:center}
  .status.live{color:var(--ok)}
  .status.bad{color:var(--err)}

  .log{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;
       max-height:280px;overflow-y:auto;display:none}
  .turn{margin-bottom:14px;font-size:14px}
  .turn .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
             color:var(--muted);display:block;margin-bottom:3px}
  .turn.them .lbl{color:var(--accent)}

  .hint{margin-top:18px;font-size:12.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Mock Interview</h1>
  <p class="sub">A live practice interview with an AI interviewer. Speak naturally &mdash; it listens and follows up.</p>

  <div class="card">
    <div class="stage">
      <div class="orb" id="orb">🎙️</div>
      <div class="who" id="who">Not connected</div>
    </div>

    <div class="row">
      <button class="primary" id="join">Start interview</button>
      <button class="ghost" id="leave" disabled>End</button>
      <button class="ghost" id="mute" disabled>Mute</button>
    </div>

    <div class="status" id="status">Click “Start interview”, then allow microphone access.</div>
    <div class="log" id="log"></div>
    <div class="hint">Uses your microphone only. Your camera is never turned on.</div>
  </div>
</div>

<script>
const LK = window.LivekitClient;
const $ = id => document.getElementById(id);
let room = null, muted = false;

function status(msg, cls=""){ const s=$("status"); s.textContent=msg; s.className="status "+cls; }
function speaking(on){ $("orb").classList.toggle("speaking", on); $("who").textContent = on ? "Interviewer speaking…" : "Listening…"; }

function addTurn(who, text){
  const log = $("log"); log.style.display = "block";
  const d = document.createElement("div");
  d.className = "turn " + (who === "Interviewer" ? "them" : "you");
  d.innerHTML = `<span class="lbl"></span><span class="txt"></span>`;
  d.querySelector(".lbl").textContent = who;
  d.querySelector(".txt").textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

async function join(){
  $("join").disabled = true;
  status("Connecting…");
  try{
    const r = await fetch("/api/token", {method:"POST"});
    if(!r.ok) throw new Error("Could not get a token (server said " + r.status + ")");
    const {url, token} = await r.json();

    room = new LK.Room({ adaptiveStream:true, dynacast:true });

    room.on(LK.RoomEvent.TrackSubscribed, (track) => {
      if(track.kind === LK.Track.Kind.Audio) track.attach();   // play interviewer audio
    });
    room.on(LK.RoomEvent.ActiveSpeakersChanged, (spk) => {
      speaking(spk.some(p => p.identity !== room.localParticipant.identity));
    });
    room.on(LK.RoomEvent.TranscriptionReceived, (segs, participant) => {
      const who = (participant && participant.identity === room.localParticipant.identity) ? "You" : "Interviewer";
      segs.filter(s => s.final).forEach(s => addTurn(who, s.text));
    });
    room.on(LK.RoomEvent.Disconnected, () => teardown("Interview ended."));

    await room.connect(url, token);
    await room.localParticipant.setMicrophoneEnabled(true);

    $("leave").disabled = false; $("mute").disabled = false;
    status("Connected — the interviewer will greet you in a moment.", "live");
    $("who").textContent = "Listening…";
  }catch(e){
    status("Couldn't start: " + e.message, "bad");
    $("join").disabled = false;
  }
}

function teardown(msg){
  if(room){ room.disconnect(); room = null; }
  $("join").disabled = false; $("leave").disabled = true; $("mute").disabled = true;
  speaking(false); $("who").textContent = "Not connected";
  status(msg);
}

$("join").onclick = join;
$("leave").onclick = () => teardown("Interview ended.");
$("mute").onclick = async () => {
  if(!room) return;
  muted = !muted;
  await room.localParticipant.setMicrophoneEnabled(!muted);
  $("mute").textContent = muted ? "Unmute" : "Mute";
};
</script>
</body>
</html>

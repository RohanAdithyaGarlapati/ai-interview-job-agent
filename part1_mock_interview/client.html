<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mock Interview - Candidate View</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@latest/dist/index.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .content {
            padding: 30px;
        }
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .video-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }
        .placeholder {
            text-align: center;
            color: #666;
        }
        .placeholder svg {
            width: 60px;
            height: 60px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }
        .status {
            background: #f3f4f6;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .status-item:last-child {
            margin-bottom: 0;
        }
        .status-label {
            font-weight: 600;
            color: #374151;
        }
        .status-value {
            color: #6b7280;
        }
        .connected .status-value {
            color: #10b981;
        }
        .error {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .success {
            background: #dcfce7;
            border: 1px solid #86efac;
            color: #166534;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .transcript {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
            margin-top: 20px;
        }
        .transcript-item {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e7eb;
        }
        .transcript-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .speaker-agent {
            color: #667eea;
            font-weight: 600;
        }
        .speaker-candidate {
            color: #764ba2;
            font-weight: 600;
        }
        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 AI Mock Interview</h1>
            <p>Real-time interview with digital avatar - Daniel</p>
        </div>

        <div class="content">
            <div id="error" class="error" style="display: none;"></div>
            <div id="success" class="success" style="display: none;"></div>

            <div class="video-grid">
                <div class="video-container">
                    <div class="video-label">Avatar (Daniel)</div>
                    <div id="agentVideo" class="placeholder">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                        <div>Waiting for avatar video...</div>
                    </div>
                </div>

                <div class="video-container">
                    <div class="video-label">You (Candidate)</div>
                    <video id="candidateVideo" autoplay muted playsinline></video>
                </div>
            </div>

            <div class="controls">
                <button id="connectBtn" class="btn-primary" onclick="connect()">Join Interview</button>
                <button id="disconnectBtn" class="btn-danger" onclick="disconnect()" disabled>Leave</button>
                <button id="audioToggle" class="btn-secondary" onclick="toggleAudio()" disabled>🎤 Mute</button>
            </div>

            <div class="status">
                <div class="status-item">
                    <span class="status-label">Status:</span>
                    <span class="status-value" id="statusText">Disconnected</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Participants:</span>
                    <span class="status-value" id="participantCount">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Audio Level:</span>
                    <span class="status-value" id="audioLevel">--</span>
                </div>
            </div>

            <div class="transcript" id="transcript" style="display: none;">
                <div style="margin-bottom: 12px; color: #6b7280; font-style: italic;">
                    Interview transcript will appear here...
                </div>
            </div>
        </div>
    </div>

    <script>
        const { Room, LocalParticipant, RoomEvent, ParticipantEvent, TrackKind } = window.LivekitClient;

        let room = null;
        let audioEnabled = true;
        let localParticipant = null;

        async function connect() {
            try {
                document.getElementById('error').style.display = 'none';
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('statusText').textContent = 'Connecting...';

                // Generate a token (in production, this comes from your backend)
                const token = await generateToken();

                const url = 'wss://ai-mockinterview-krzxmcd5.livekit.cloud';
                const roomName = 'mock-interview-room';

                room = new Room();

                room.on(RoomEvent.ParticipantConnected, (participant) => {
                    console.log('Participant connected:', participant.name);
                    updateParticipantCount();
                });

                room.on(RoomEvent.ParticipantDisconnected, (participant) => {
                    console.log('Participant disconnected:', participant.name);
                    updateParticipantCount();
                });

                room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
                    if (track.kind === TrackKind.Video) {
                        const videoElement = document.getElementById('agentVideo');
                        if (videoElement.innerHTML.includes('svg')) {
                            videoElement.innerHTML = '';
                        }
                        videoElement.appendChild(track.attach());
                    }
                });

                await room.connect(url, token);

                // Publish local audio/video
                await room.localParticipant.enableCameraAndMicrophone();

                const videoTrack = room.localParticipant.videoTrackPublications[0];
                if (videoTrack) {
                    const videoElement = videoTrack.track.attach();
                    document.getElementById('candidateVideo').replaceWith(videoElement);
                    videoElement.id = 'candidateVideo';
                }

                localParticipant = room.localParticipant;
                updateStatus('Connected');
                updateParticipantCount();

                document.getElementById('disconnectBtn').disabled = false;
                document.getElementById('audioToggle').disabled = false;
                document.getElementById('success').style.display = 'block';
                document.getElementById('success').textContent = '✓ Connected! Interview is starting...';
                document.getElementById('transcript').style.display = 'block';

            } catch (error) {
                console.error('Connection error:', error);
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = '❌ Connection failed: ' + error.message;
                updateStatus('Error');
                document.getElementById('connectBtn').disabled = false;
            }
        }

        async function generateToken() {
            // For development: you can generate a token from LiveKit console
            // In production, get this from your backend API
            const response = await fetch('http://localhost:8000/get-token', {
                method: 'POST',
                body: JSON.stringify({
                    roomName: 'mock-interview-room',
                    participantName: 'Candidate-' + Date.now()
                })
            }).catch(() => {
                // Fallback: use a pre-generated token or ask user for token
                const token = prompt('Paste your LiveKit token (get from https://cloud.livekit.io > API Keys):');
                if (!token) throw new Error('Token required');
                return { token };
            });

            if (response && response.token) {
                return response.token;
            }
            return null;
        }

        function disconnect() {
            if (room) {
                room.disconnect();
                room = null;
            }
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            document.getElementById('audioToggle').disabled = true;
            updateStatus('Disconnected');
            document.getElementById('transcript').style.display = 'none';
            document.getElementById('success').style.display = 'none';
        }

        function toggleAudio() {
            if (localParticipant) {
                audioEnabled = !audioEnabled;
                localParticipant.audioTrackPublications.forEach(pub => {
                    pub.track.enabled = audioEnabled;
                });
                document.getElementById('audioToggle').textContent = audioEnabled ? '🎤 Mute' : '🔇 Unmute';
            }
        }

        function updateStatus(status) {
            document.getElementById('statusText').textContent = status;
            const statusDiv = document.querySelector('.status');
            statusDiv.classList.toggle('connected', status === 'Connected');
        }

        function updateParticipantCount() {
            if (room) {
                const count = room.participants.size + 1; // +1 for self
                document.getElementById('participantCount').textContent = count;
            }
        }

        // Show instructions
        window.addEventListener('load', () => {
            const transcript = document.getElementById('transcript');
            if (transcript && transcript.style.display !== 'none') {
                transcript.innerHTML = `
                    <div style="color: #667eea; font-weight: 600; margin-bottom: 12px;">📋 Interview Flow</div>
                    <div style="margin-bottom: 8px;">1. Click "Join Interview" to connect</div>
                    <div style="margin-bottom: 8px;">2. Allow camera/microphone access when prompted</div>
                    <div style="margin-bottom: 8px;">3. Daniel will greet you and ask questions</div>
                    <div>4. Speak naturally - the agent listens and responds in real-time</div>
                `;
            }
        });
    </script>
</body>
</html>
